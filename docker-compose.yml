name: soupdb-demo

services:
  engine:
    # Pin explícito por reproducibilidad; el manifiesto es multi-arch.
    image: ghcr.io/bd2-project/soupdb:0.7.1
    environment:
      PAGE_SIZE: ${PAGE_SIZE:-4096}
      BUFFER_POOL_SIZE: ${BUFFER_POOL_SIZE:-1024}
      REORG_THRESHOLD: ${REORG_THRESHOLD:-0.3}
      BPLUS_ORDER: ${BPLUS_ORDER:-4}
      HASH_GLOBAL_DEPTH_MAX: ${HASH_GLOBAL_DEPTH_MAX:-16}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
      LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-5000}
      SOUPDB_PLUGIN_STORAGE: /app/data/plugins
    ports:
      - "${DRIVER_PORT:-55432}:55432"
    volumes:
      - engine-data:/app/data
      - plugin-site:/opt/soupdb/plugin-site:ro
    depends_on:
      plugins:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 55432), 2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Instala los plugins desde PyPI en un volumen compartido.
  # Instala todos los plugins del gestor (full-text + vectorial).
  # SOUPDB_EXTRA_PLUGINS permite sumar paquetes adicionales.
  plugins:
    image: python:3.12-slim
    entrypoint: ["sh", "-c"]
    command:
      - |
        pip install --no-cache-dir --target /opt/soupdb/plugin-site \
          soupdb-inverted soupdb-vector ${SOUPDB_EXTRA_PLUGINS:-}
        PYTHONPATH=/opt/soupdb/plugin-site python -c "import importlib.metadata as m; print('plugins:', [e.name for e in m.entry_points(group='soupdb.plugins')])"
    volumes:
      - plugin-site:/opt/soupdb/plugin-site
    restart: "no"

  # Genera un dataset sintetico de imagenes y entrena el codebook de la demo
  # vectorial. Es idempotente: si el codebook ya existe, no hace nada.
  vector-dataset:
    image: python:3.12-slim
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PYTHONPATH=/opt/soupdb/plugin-site
        if [ -f /app/data/vector-dataset/codebook.npz ]; then
          echo "vector-dataset: ya existe; nada que hacer"
          exit 0
        fi
        python - <<'PY2'
        import os

        import cv2
        import numpy as np

        rng = np.random.default_rng(11)
        root = "/app/data/vector-dataset/img"
        os.makedirs(root, exist_ok=True)
        for i in range(40):
            image = rng.integers(0, 255, (256, 256, 3), dtype=np.uint8)
            cv2.circle(
                image,
                (int(rng.integers(20, 236)), int(rng.integers(20, 236))),
                int(rng.integers(10, 60)),
                (0, 255, 0),
                -1,
            )
            cv2.rectangle(
                image,
                (int(rng.integers(0, 200)), int(rng.integers(0, 200))),
                (int(rng.integers(50, 250)), int(rng.integers(50, 250))),
                (255, 0, 0),
                3,
            )
            cv2.imwrite(os.path.join(root, f"img_{i:03d}.png"), image)
        print("vector-dataset: 40 imagenes sinteticas creadas")
        PY2
        python -m soupdb_vector.multimedia.manifest image /app/data/vector-dataset/img /app/data/vector-dataset/manifest.jsonl --limit 40
        python -m soupdb_vector.multimedia.build_vectors /app/data/vector-dataset/manifest.jsonl /app/data/vector-dataset/img /app/data/vector-dataset/cache /app/data/vector-dataset/codebook.npz /app/data/vector-dataset/vectores.bin --k 16 --max-descriptors 5000
    volumes:
      - engine-data:/app/data
      - plugin-site:/opt/soupdb/plugin-site:ro
    depends_on:
      plugins:
        condition: service_completed_successfully
    restart: "no"

  # Siembra idempotente de datos de ejemplo antes de que arranque el motor.
  # Usa la misma imagen del gestor y escribe en el volumen compartido.
  seed:
    image: ghcr.io/bd2-project/soupdb:0.7.1
    entrypoint: ["python", "-c"]
    command:
      - |
        import importlib.metadata as md
        import json
        from pathlib import Path

        from engine.common.catalog import Catalog
        from engine.query import execute_sql

        catalog = Catalog("/app/data")
        if "accounts" in catalog.tables():
            print("seed: la base ya tiene datos, nada que hacer")
        else:
            execute_sql("CREATE TABLE accounts (id INT, balance INT)", catalog)
            execute_sql("INSERT INTO accounts VALUES (1, 100)", catalog)
            execute_sql("INSERT INTO accounts VALUES (2, 200)", catalog)
            execute_sql("CREATE TABLE lugares (id INT, nombre TEXT, ubicacion POINT)", catalog)
            execute_sql("INSERT INTO lugares (id, nombre, ubicacion) VALUES (1, 'Lima', POINT(-12.04, -77.03))", catalog)
            execute_sql("INSERT INTO lugares (id, nombre, ubicacion) VALUES (2, 'Cusco', POINT(-13.52, -71.97))", catalog)
            execute_sql("INSERT INTO lugares (id, nombre, ubicacion) VALUES (3, 'Arequipa', POINT(-16.40, -71.54))", catalog)
            print("seed: tablas accounts y lugares creadas")
        catalog.close()

        # Activacion por SQL (equivalente a CREATE EXTENSION de Postgres):
        # persiste la config en SysPlugins y el motor la reaplica al abrir.
        cat = Catalog("/app/data")
        active = {row[0] for row in execute_sql("SELECT plugin_name FROM SysPlugins", cat).rows}
        if "INVERTED" not in active:
            execute_sql(
                "CREATE EXTENSION inverted WITH (storage_root = '/app/data/plugins/inverted')",
                cat,
            )
        installed = {ep.name for ep in md.entry_points(group="soupdb.plugins")}
        manifest_path = Path("/app/data/vector-dataset/manifest.jsonl")
        codebook_path = Path("/app/data/vector-dataset/codebook.npz")
        if {"ivf", "hnsw"} <= installed and manifest_path.exists() and codebook_path.exists():
            profiles = json.dumps(
                {
                    "img-v1": {
                        "kind": "image",
                        "root": "/app/data/vector-dataset/img",
                        "codebook": str(codebook_path),
                    }
                }
            )
            vector_config = (
                "storage_root = '/app/data/plugins/vector', "
                f"profiles = '{profiles}'"
            )
            if "IVF" not in active:
                execute_sql(f"CREATE EXTENSION ivf WITH ({vector_config})", cat)
            if "HNSW" not in active:
                execute_sql(f"CREATE EXTENSION hnsw WITH ({vector_config})", cat)
            if "imagenes" not in cat.tables():
                execute_sql("CREATE TABLE imagenes (id INT PRIMARY KEY, archivo TEXT)", cat)
                paths = [
                    json.loads(line)["path"]
                    for line in manifest_path.read_text().splitlines()
                    if line.strip()
                ]
                for ident, path in enumerate(paths, start=1):
                    execute_sql(f"INSERT INTO imagenes VALUES ({ident}, '{path}')", cat)
            if cat.index_location("idx_img_ivf") is None:
                execute_sql(
                    "CREATE INDEX idx_img_ivf ON imagenes (archivo) USING IVF "
                    "WITH (metric = 'cosine', dimension = 16, profile = 'img-v1')",
                    cat,
                )
                print("seed: indice vectorial IVF creado")
            if cat.index_location("idx_img_hnsw") is None:
                execute_sql(
                    "CREATE INDEX idx_img_hnsw ON imagenes (archivo) USING HNSW "
                    "WITH (metric = 'cosine', dimension = 16, profile = 'img-v1')",
                    cat,
                )
                print("seed: indice vectorial HNSW creado")
        else:
            print("seed: dataset/codebook vectorial no disponible; se omite la demo vectorial")
        if "docs" not in cat.tables():
            execute_sql("CREATE TABLE docs (id INT, contenido TEXT)", cat)
            execute_sql("INSERT INTO docs VALUES (1, 'bases de datos espaciales')", cat)
            execute_sql("INSERT INTO docs VALUES (2, 'indice invertido y busqueda de texto')", cat)
            execute_sql("INSERT INTO docs VALUES (3, 'vectores y similitud coseno')", cat)
        if cat.index_location("idx_docs") is None:
            execute_sql("CREATE INDEX idx_docs ON docs (contenido) USING INVERTED", cat)
            print("seed: plugin INVERTED activado e indice idx_docs creado")
        else:
            print("seed: plugin INVERTED ya activado")
        cat.close()
    volumes:
      - engine-data:/app/data
      - plugin-site:/opt/soupdb/plugin-site
    depends_on:
      plugins:
        condition: service_completed_successfully
      vector-dataset:
        condition: service_completed_successfully
    restart: "no"

  # Cliente web SSR: el servidor Node habla el protocolo binario con el motor.
  soupchef:
    image: ghcr.io/bd2-project/soupchef:0.3.0
    ports:
      - "${SOUPCHEF_PORT:-8080}:3000"
    environment:
      SOUPDB_HOST: engine
      SOUPDB_PORT: 55432
      SOUPDB_WIRE_VERSION: ${SOUPDB_WIRE_VERSION:-2}
      SOUPDB_TIMEOUT_MS: ${SOUPDB_TIMEOUT_MS:-15000}
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('net');const s=n.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  engine-data:
  plugin-site:
